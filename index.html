<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huffman Engine | Premium Compression</title>
    <style>
        /* --- Base & Reset --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            /* Tech Grid and Base Gradient */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            color: #e2e8f0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden; padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* --- Ambient Glowing Orbs --- */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: floatOrb 15s infinite ease-in-out alternate;
        }
        body::before {
            top: 5%; left: 10%;
            width: 400px; height: 400px;
            background: rgba(59, 130, 246, 0.15); /* Blue glow */
        }
        body::after {
            bottom: 10%; right: 10%;
            width: 350px; height: 350px;
            background: rgba(16, 185, 129, 0.12); /* Green glow */
            animation-delay: -5s;
            animation-direction: alternate-reverse;
        }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }
        @keyframes glassSweep {
            0% { left: -150%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* --- Main Container (Glossy Glassmorphism) --- */
        .container {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 45px 40px; border-radius: 24px;
            
            /* Glossy Borders */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            
            /* Deep Shadow & Inner Glow */
            box-shadow: 
                0 30px 60px -10px rgba(0, 0, 0, 0.6),
                inset 0 1px 20px rgba(255, 255, 255, 0.03);
            
            width: 100%; max-width: 550px; text-align: center;
            animation: fadeIn 0.6s ease-out forwards;
            position: relative;
            overflow: hidden;
        }

        /* Diagonal Glass Sweep Reflection */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transform: skewX(-25deg);
            animation: glassSweep 7s infinite;
            pointer-events: none;
        }

        h2 { color: #10b981; font-size: clamp(24px, 5vw, 28px); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; position: relative; }
        p.subtitle { color: #94a3b8; font-size: clamp(13px, 3vw, 14px); margin-bottom: 30px; letter-spacing: 0.5px; position: relative;}

        .upload-area {
            border: 2px dashed rgba(71, 85, 105, 0.8); border-radius: 16px; padding: 35px 20px;
            background: rgba(15, 23, 42, 0.3); margin-bottom: 25px; transition: all 0.3s ease; position: relative;
        }
        .upload-area:hover { border-color: #3b82f6; background: rgba(15, 23, 42, 0.6); box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.1); }
        input[type="file"] { display: none; }
        
        .upload-label {
            background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; padding: 14px 28px;
            border-radius: 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center;
            transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .upload-label:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5); }
        .filename-display { margin-top: 15px; font-size: 14px; color: #cbd5e1; font-family: monospace; word-wrap: break-word; }

        button[type="submit"] {
            background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 16px 30px;
            font-size: 16px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: 700;
            text-transform: uppercase; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            position: relative; overflow: hidden;
        }
        button[type="submit"]:hover { transform: translateY(-2px); animation: pulseGlow 1.5s infinite; }
        
        /* Button Inner Gloss */
        button[type="submit"]::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 40%;
            background: linear-gradient(rgba(255,255,255,0.2), transparent);
            border-radius: 12px 12px 0 0; pointer-events: none;
        }

        #results-box { display: none; }

        .stats {
            margin-top: 30px; background: rgba(15, 23, 42, 0.5); padding: 25px; border-radius: 16px;
            border-left: 4px solid #10b981; text-align: left; animation: fadeIn 0.5s ease-out forwards;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }
        .stats strong { display: block; color: #fff; margin-bottom: 15px; font-size: 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 10px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 15px; }
        .stat-label { color: #94a3b8; }
        .stat-value { font-family: monospace; color: #e2e8f0; font-size: 16px;}
        .highlight { color: #10b981; font-weight: bold; font-size: clamp(20px, 4vw, 24px); text-shadow: 0 0 15px rgba(16,185,129,0.5); }

        .download-btn {
            display: flex; align-items: center; justify-content: center; margin-top: 25px; background: rgba(255,255,255,0.05);
            color: #f8fafc; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s; backdrop-filter: blur(5px);
        }
        .download-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        @media screen and (max-width: 480px) {
            .stat-row { flex-direction: column; align-items: flex-start; gap: 4px; }
            .stat-row.highlight-row { flex-direction: row; align-items: center; margin-top: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Huffman Engine</h2>
        <p class="subtitle">Lossless C-Core Text Compression</p>
        
        <form id="compression-form">
            <div class="upload-area">
                <label for="file-upload" class="upload-label">
                    <svg style="width:20px; height:20px; margin-right:8px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Select Target File
                </label>
                <input id="file-upload" type="file" accept=".txt" required onchange="showFileName(this)">
                <div class="filename-display" id="filename">Awaiting file input...</div>
            </div>
            <button type="submit" id="compress-btn">Execute Compression</button>
        </form>

        <!-- NO MORE PLACEHOLDERS: These are updated instantly via Javascript -->
        <div class="stats" id="results-box">
            <strong>Diagnostic Results</strong>
            <div class="stat-row">
                <span class="stat-label">Original Payload:</span>
                <span class="stat-value" id="val-original">0 bytes</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Compressed Package:</span>
                <span class="stat-value" id="val-compressed">0 bytes</span>
            </div>
            <div class="stat-row highlight-row" style="margin-top: 20px;">
                <span class="stat-label" style="color: #fff; font-weight: bold;">Space Reclaimed:</span>
                <span class="stat-value highlight" id="val-ratio">0%</span>
            </div>
            
            <a href="/download" class="download-btn">
                <svg style="width:20px; height:20px; margin-right:8px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download .bin Package
            </a>
        </div>
    </div>

    <script>
        function showFileName(input) {
            const display = document.getElementById('filename');
            if (input.files[0]) {
                display.style.color = '#10b981';
                display.innerText = "> " + input.files[0].name + " loaded.";
            }
        }

        // The JavaScript Backend Connection
        document.getElementById('compression-form').addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevents the screen from refreshing!
            
            const btn = document.getElementById('compress-btn');
            const fileInput = document.getElementById('file-upload');
            if (!fileInput.files[0]) return;

            // Show loading animation
            const originalText = btn.innerHTML;
            btn.innerHTML = '<svg style="width:20px; height:20px; vertical-align:middle; animation:spin 1s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Compressing...';
            btn.style.pointerEvents = 'none';

            // Send to Python
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/compress', { method: 'POST', body: formData });
                const data = await response.json();

                // Inject the returned numbers straight into the UI
                document.getElementById('val-original').innerText = data.original + ' bytes';
                document.getElementById('val-compressed').innerText = data.compressed + ' bytes';
                document.getElementById('val-ratio').innerText = data.ratio + '%';
                
                // Unhide the diagnostic box
                document.getElementById('results-box').style.display = 'block';
            } catch (error) {
                alert('Compression failed. Check your Python terminal for errors!');
            } finally {
                btn.innerHTML = originalText;
                btn.style.pointerEvents = 'auto';
            }
        });
    </script>
    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
</body>
</html>
